name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write # 正式 Release 发布需要（新仓库 GITHUB_TOKEN 默认只读）

env:
  CARGO_TERM_COLOR: always
  API_LEVEL: "30" # 与 customize.sh 最低要求 API 30 对齐

jobs:
  build-daemon:
    name: 交叉编译 sundownd (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装 cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: 构建 sundownd (release)
        working-directory: daemon
        run: cargo ndk -t arm64-v8a --platform ${{ env.API_LEVEL }} build --release

      - name: 校验产物
        run: |
          file daemon/target/aarch64-linux-android/release/sundownd
          ls -lh daemon/target/aarch64-linux-android/release/sundownd

      - name: 上传 daemon 二进制
        uses: actions/upload-artifact@v7
        with:
          name: sundownd-aarch64
          path: daemon/target/aarch64-linux-android/release/sundownd
          retention-days: 30

  build-probe:
    name: 编译 libsunprobe.so (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 构建 L1 探针桩（runner 自带 NDK + CMake + Ninja）
        working-directory: probe
        run: |
          HASH="${GITHUB_SHA::7}"
          echo "PROBE_BUILD_HASH=$HASH"
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DPROBE_BUILD_HASH="$HASH"
          cmake --build build
          echo "$HASH" > build/probe.hash

      - name: 校验产物
        run: |
          file probe/build/libsunprobe.so
          ls -lh probe/build/libsunprobe.so
          cat probe/build/probe.hash

      - name: 上传探针桩与 hash
        uses: actions/upload-artifact@v7
        with:
          name: libsunprobe-arm64-v8a
          path: |
            probe/build/libsunprobe.so
            probe/build/probe.hash
          retention-days: 30

  build-dex:
    name: 编译 probe.dex (javac + d8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 注入构建版本（版本闭环：dex 上报版本 = 本 commit short sha）
        run: |
          HASH="${GITHUB_SHA::7}"
          echo "DEX_BUILD_VERSION=$HASH"
          sed -i "s/@DEX_BUILD_VERSION@/$HASH/" dex/src/ren/sunset/sundown/BuildInfo.java
          grep DEX_BUILD_VERSION dex/src/ren/sunset/sundown/BuildInfo.java

      - name: 定位 Android platform（取 runner 上最高版本兜底）
        id: platform
        run: |
          PJAR="$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n1)"
          echo "android_jar=$PJAR" >> "$GITHUB_OUTPUT"
          echo "使用 bootclasspath: $PJAR"

      - name: javac 编译（Java 8 语法级，bootclasspath = android.jar）
        run: |
          mkdir -p dex/build/classes
          find dex/src -name '*.java' | sort > dex/build/sources.list
          javac -source 8 -target 8 \
            -bootclasspath "${{ steps.platform.outputs.android_jar }}" \
            -d dex/build/classes @dex/build/sources.list

      - name: d8 转 dex（min-api 30）+ 版本 hash 闭环
        run: |
          D8="$(ls -d "$ANDROID_HOME"/build-tools/*/d8 | sort -V | tail -n1)"
          echo "使用 d8: $D8"
          # d8 要求 --output 为已存在目录（或 zip/jar 文件名），必须先创建
          mkdir -p dex/build/out
          find dex/build/classes -name '*.class' | sort | xargs "$D8" \
            --min-api ${{ env.API_LEVEL }} \
            --output dex/build/out
          mv dex/build/out/classes.dex dex/build/probe.dex
          echo "${GITHUB_SHA::7}" > dex/build/probe.dex.hash

      - name: 编译 bridge.dex（L2b canonical NativeBridge，独立产物）
        run: |
          # bridge.dex 只含 NativeBridge（probe.dex 中的副本为父委托遮蔽的死代码，
          # 见 dex/src/.../hook/NativeBridge.java 类加载纪律注释）
          mkdir -p dex/build/bridge-classes dex/build/bridge-out
          javac -source 8 -target 8 \
            -bootclasspath "${{ steps.platform.outputs.android_jar }}" \
            -d dex/build/bridge-classes dex/src/ren/sunset/sundown/hook/NativeBridge.java
          D8="$(ls -d "$ANDROID_HOME"/build-tools/*/d8 | sort -V | tail -n1)"
          find dex/build/bridge-classes -name '*.class' | sort | xargs "$D8" \
            --min-api ${{ env.API_LEVEL }} --output dex/build/bridge-out
          mv dex/build/bridge-out/classes.dex dex/build/bridge.dex

      - name: 校验产物
        run: |
          ls -lh dex/build/probe.dex dex/build/bridge.dex
          cat dex/build/probe.dex.hash

      - name: 上传探针 dex 与版本 hash
        uses: actions/upload-artifact@v7
        with:
          name: probe-dex
          path: |
            dex/build/probe.dex
            dex/build/probe.dex.hash
            dex/build/bridge.dex
          retention-days: 30

  build-bridge:
    name: 编译 libsundownhook.so（L2b LSPlant bridge，Android16 兼容链）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 拉取 Dobby AAR（pinned + sha256，静态链入 bridge）
        run: |
          mkdir -p deps
          curl -fsSL -o deps/dobby.aar \
            https://repo1.maven.org/maven2/io/github/vvb2060/ndk/dobby/1.2/dobby-1.2.aar
          echo "251f48ae21686d7f69276c50644ca345f450e45110057437f7d76bb14cddf3a1  deps/dobby.aar" \
            | sha256sum -c -
          cd deps
          unzip -o -q dobby.aar -d dobby
          ls -lh dobby/prefab/modules/dobby/libs/android.arm64-v8a/

      - name: 拉取 LSPlant master（pinned commit，Android 15/16/17 适配）
        # Maven 官方仅发布 lsplant 6.4（2024-04，面向 Android 14），在 Android 16 (API 36)
        # 的 libart.so 上符号大面积不兼容（Instrumentation/JIT/DexFile/GC 签名变更 + LOCAL
        # 符号 .__uniq 后缀），lsplant::Init 失败 → bridge 无法上线（实机 V2 卡点）。
        # master 已适配 API 36/37（commit 含 Baklava/Cinnamon Bun 常量、Android15 jit 修复、
        # memfd/SDK37 准备），故改为 pinned commit 源码构建。LGPL-3.0 动态链接分发不变。
        run: |
          git clone --depth 1 https://github.com/LSPosed/LSPlant.git /tmp/lsplant
          cd /tmp/lsplant
          # pin 防上游漂移：HEAD 非 pinned commit 时按需浅拉取指定 commit
          if [ "$(git rev-parse HEAD)" != "84256d4cb51abd79280da5c29437fb7004391667" ]; then
            git fetch --depth 1 origin 84256d4cb51abd79280da5c29437fb7004391667
            git checkout 84256d4cb51abd79280da5c29437fb7004391667
          fi
          # 按需拉取构建所需的 https submodule（全量 --recursive 会触发 test/ 下
          # SSH URL 的 lsparself/lsprism，CI 无密钥必败）
          git submodule update --init --depth 1 lsplant/src/main/jni/external/dex_builder
          git -C lsplant/src/main/jni/external/dex_builder \
              submodule update --init --depth 1 external/parallel_hashmap

      - name: 安装 NDK r29（LSPlant master 要求 C++23 modules 工具链）
        run: |
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "NDK_HOME=/opt/android-ndk-r29" >> "$GITHUB_ENV"

      - name: 构建 liblsplant.so（master 源码 + Sundown patch，静态链入 libc++）
        working-directory: /tmp/lsplant/lsplant/src/main/jni
        run: |
          # Sundown patch：SetClassStatus hook 并发类加载空指针防护（2026-08-03
          # 实机 SIGSEGV 事故，见 Sundown-软重启事故报告-v0.4.30部署与SetClassStatus
          # 概率性地雷.md）。patch 随仓库分发（bridge/lsplant-patches/），LGPL-3.0
          # 修改合规见 bridge/README.md「LSPlant patch 说明」。
          git apply --check "$GITHUB_WORKSPACE/bridge/lsplant-patches/0001-classstatus-null-guard.patch" \
            && git apply "$GITHUB_WORKSPACE/bridge/lsplant-patches/0001-classstatus-null-guard.patch" \
            || { echo "::error::LSPlant patch 应用失败"; exit 1; }
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-static-libstdc++" \
            -DDEBUG_SYMBOLS_PATH=/tmp/lsplant-sym
          cmake --build build
          # 防回归：Android 16 实机无 libc++_shared.so（bridge/README 记录），
          # 产物不得引入该 DT_NEEDED（否则 System.load 必然失败）
          if readelf -d build/liblsplant.so | grep -q 'libc++_shared'; then
            echo "::error::liblsplant.so 意外依赖 libc++_shared.so"
            exit 1
          fi
          file build/liblsplant.so
          ls -lh build/liblsplant.so

      - name: 构建 libsundownhook.so（bridge，链接 master 构建的 liblsplant.so）
        working-directory: bridge
        run: |
          HASH="${GITHUB_SHA::7}"
          echo "BRIDGE_BUILD_HASH=$HASH"
          # 组装 prefab 布局（保持 bridge/CMakeLists.txt 不变）
          mkdir -p /tmp/lsplant-prefab/libs/android.arm64-v8a /tmp/lsplant-prefab/include/utils
          cp /tmp/lsplant/lsplant/src/main/jni/include/lsplant.hpp /tmp/lsplant-prefab/include/
          cp /tmp/lsplant/lsplant/src/main/jni/include/utils/*.hpp /tmp/lsplant-prefab/include/utils/
          cp /tmp/lsplant/lsplant/src/main/jni/build/liblsplant.so \
             /tmp/lsplant-prefab/libs/android.arm64-v8a/
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLSPLANT_PREFAB=/tmp/lsplant-prefab \
            -DDOBBY_PREFAB="$GITHUB_WORKSPACE/deps/dobby/prefab/modules/dobby" \
            -DBRIDGE_BUILD_HASH="$HASH"
          cmake --build build
          echo "$HASH" > build/hook.hash
          # LGPL-3.0：liblsplant.so 随模块分发（master 源码构建，动态链接、不修改；
          # 源码获取见 bridge/README.md）
          cp /tmp/lsplant-prefab/libs/android.arm64-v8a/liblsplant.so build/liblsplant.so

      - name: 校验产物
        run: |
          file bridge/build/libsundownhook.so bridge/build/liblsplant.so
          ls -lh bridge/build/libsundownhook.so bridge/build/liblsplant.so
          cat bridge/build/hook.hash

      - name: 上传 bridge 产物与 hash
        uses: actions/upload-artifact@v7
        with:
          name: sundownhook-arm64-v8a
          path: |
            bridge/build/libsundownhook.so
            bridge/build/liblsplant.so
            bridge/build/hook.hash
          retention-days: 30

  package-module:
    name: 打包 KSU 模块 zip
    needs: [build-daemon, build-probe, build-dex, build-bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 下载 daemon 二进制并注入模块
        uses: actions/download-artifact@v8
        with:
          name: sundownd-aarch64
          path: module/system/bin/
      # 注意：此时 module/system/bin/sundownd 的文本占位文件被真实二进制覆盖
      # （仅 CI 工作区，不提交；占位文件仍在 git 中保证脚本兼容）

      - name: 下载探针桩并注入模块（zygisk 约定路径 + 期望 hash）
        uses: actions/download-artifact@v8
        with:
          name: libsunprobe-arm64-v8a
          path: probe/build/

      - name: 布置 zygisk 资产
        run: |
          mkdir -p module/zygisk
          cp probe/build/libsunprobe.so module/zygisk/arm64-v8a.so
          cp probe/build/probe.hash module/zygisk/probe.hash
          ls -lh module/zygisk/

      - name: 下载探针 dex 并注入模块（L2）
        uses: actions/download-artifact@v8
        with:
          name: probe-dex
          path: dex/build/

      - name: 布置 dex 资产（root 字节源 + 期望版本 + magic-mount 冷启动兜底）
        run: |
          # 1) root 侧字节源：post-fs-data.sh 同步到 /data/adb/sundown/probe/，
          #    daemon 经 abstract socket 下发字节（uid 1000 不直接读 /data/adb——DAC 铁律）
          mkdir -p module/probe
          cp dex/build/probe.dex module/probe/probe.dex
          cp dex/build/probe.dex.hash module/probe/probe.dex.hash
          # 2) magic-mount 兜底：uid 1000 可读、SELinux 无争议；dex 层冷启动/断线自愈用
          mkdir -p module/system/etc/sundown
          cp dex/build/probe.dex module/system/etc/sundown/probe.dex
          # 3) L2b canonical NativeBridge（bridge.dex）：probe.dex 各代的父链，
          #    native 唯一绑定点（类加载拓扑见 dex/src/.../hook/LsPlantBridge.java）
          cp dex/build/bridge.dex module/system/etc/sundown/bridge.dex
          chmod 0644 module/system/etc/sundown/probe.dex module/system/etc/sundown/bridge.dex
          ls -lh module/probe/ module/system/etc/sundown/

      - name: 下载 bridge 产物并注入模块（L2b native 伴生库）
        uses: actions/download-artifact@v8
        with:
          name: sundownhook-arm64-v8a
          path: bridge/build/

      - name: 布置 bridge 资产（magic-mount 原生库 + 期望 hash）
        run: |
          # system/lib64/：magic-mount → /system/lib64/，uid 1000 可读（dex 层 System.load）
          mkdir -p module/system/lib64
          cp bridge/build/libsundownhook.so module/system/lib64/libsundownhook.so
          cp bridge/build/liblsplant.so module/system/lib64/liblsplant.so
          chmod 0644 module/system/lib64/*.so
          # hook/hook.hash：daemon 期望 bridge build hash（四位一体闭环；hook/ 不入 /system）
          mkdir -p module/hook
          cp bridge/build/hook.hash module/hook/hook.hash
          ls -lh module/system/lib64/ module/hook/

      - name: 修正权限
        run: |
          chmod 755 module/system/bin/sundownd module/system/bin/sunctl
          chmod 755 module/post-fs-data.sh module/service.sh module/uninstall.sh module/customize.sh

      - name: 读取模块版本
        id: meta
        run: echo "version=$(grep '^version=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: 版本号一致性防呆校验（README「版本号策略」三处同步）
        run: |
          MP="$(grep '^version=' module/module.prop | cut -d= -f2 | sed 's/^v//')"
          PD="$(grep '^pub const VERSION_NAME' daemon/src/paths.rs | cut -d'"' -f2)"
          SC="$(grep '^VERSION=' module/system/bin/sunctl | cut -d'"' -f2)"
          echo "module.prop=$MP paths.rs=$PD sunctl=$SC"
          if [ "$MP" != "$PD" ] || [ "$MP" != "$SC" ]; then
            echo "::error::版本号三处不同步（module.prop / paths.rs / sunctl），见 README「版本号策略」"
            exit 1
          fi

      - name: 打包模块 zip
        run: |
          cd module
          zip -r9 "../sundown-${{ steps.meta.outputs.version }}.zip" . -x '.*'
          cd ..
          ls -lh sundown-*.zip

      # 模块 zip 不再上传 artifact：artifact 下载强制双层套娃（机制无法关闭），
      # 单层模块包统一走下方正式 Release 渠道，避免误下载。

      # v0.4.56-l3 起发布策略：不做 Nightly 测试版，每次 main push 构建成功即
      # 直接发布正式 Release（tag = 版本号），每个版本在 Release 与 CHANGELOG 留档。
      # 同版本多次构建 → 覆盖 asset（软发布）；版本号变更 → 新 tag 新 Release。
      # 官方约束（GitHub REST API 2026-03-10 版）：若本次 push 的 commit 修改了
      # .github/workflows/ 下文件，GITHUB_TOKEN 无权创建 Release（除非仓库管理员
      # 开启 "Allow GitHub Actions to create and approve pull requests" 或换 PAT）。
      # 遇此情况该次发布会失败，属 GitHub 安全限制，重跑或手动补发即可。
      # 官方 README 推荐 tag 触发（github.ref_type == 'tag'）；本项目采用 push main
      # 直接发布正式 Release（既定策略，CHANGELOG 防呆保证留档），语义等同且已验证。

      - name: CHANGELOG 版本条目防呆（每个版本必须留档）
        run: |
          V="${{ steps.meta.outputs.version }}"
          if ! grep -q "^## $V " CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 $V 条目（发布策略：每个版本必须记录）"
            exit 1
          fi
          echo "✅ CHANGELOG 已记录 $V"

      - name: 提取 CHANGELOG 当前版本条目（Release notes）
        id: notes
        run: |
          V="${{ steps.meta.outputs.version }}"
          awk -v v="$V" 'BEGIN{p=0}
            $0 ~ "^## " v " " {p=1; next}
            p==1 && $0 ~ "^## " {exit}
            p{print}' CHANGELOG.md > /tmp/notes.md
          echo "notes_lines=$(wc -l < /tmp/notes.md)" >> "$GITHUB_OUTPUT"

      - name: 发布正式 Release（自动留档，非 prerelease）
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: Sundown ${{ steps.meta.outputs.version }}（正式版）
          body_path: /tmp/notes.md
          prerelease: false
          overwrite_files: true
          files: sundown-*.zip

      - name: 发布到 GitHub Release（手动创建 Release 时触发）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: sundown-*.zip