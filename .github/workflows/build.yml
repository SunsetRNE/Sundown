name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write # rolling Nightly Release 需要（新仓库 GITHUB_TOKEN 默认只读）

env:
  CARGO_TERM_COLOR: always
  API_LEVEL: "30" # 与 customize.sh 最低要求 API 30 对齐

jobs:
  build-daemon:
    name: 交叉编译 sundownd (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装 cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: 构建 sundownd (release)
        working-directory: daemon
        run: cargo ndk -t arm64-v8a --platform ${{ env.API_LEVEL }} build --release

      - name: 校验产物
        run: |
          file daemon/target/aarch64-linux-android/release/sundownd
          ls -lh daemon/target/aarch64-linux-android/release/sundownd

      - name: 上传 daemon 二进制
        uses: actions/upload-artifact@v7
        with:
          name: sundownd-aarch64
          path: daemon/target/aarch64-linux-android/release/sundownd
          retention-days: 30

  build-probe:
    name: 编译 libsunprobe.so (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 构建 L1 探针桩（runner 自带 NDK + CMake + Ninja）
        working-directory: probe
        run: |
          HASH="${GITHUB_SHA::7}"
          echo "PROBE_BUILD_HASH=$HASH"
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DPROBE_BUILD_HASH="$HASH"
          cmake --build build
          echo "$HASH" > build/probe.hash

      - name: 校验产物
        run: |
          file probe/build/libsunprobe.so
          ls -lh probe/build/libsunprobe.so
          cat probe/build/probe.hash

      - name: 上传探针桩与 hash
        uses: actions/upload-artifact@v7
        with:
          name: libsunprobe-arm64-v8a
          path: |
            probe/build/libsunprobe.so
            probe/build/probe.hash
          retention-days: 30

  build-dex:
    name: 编译 probe.dex (javac + d8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 注入构建版本（版本闭环：dex 上报版本 = 本 commit short sha）
        run: |
          HASH="${GITHUB_SHA::7}"
          echo "DEX_BUILD_VERSION=$HASH"
          sed -i "s/@DEX_BUILD_VERSION@/$HASH/" dex/src/ren/sunset/sundown/BuildInfo.java
          grep DEX_BUILD_VERSION dex/src/ren/sunset/sundown/BuildInfo.java

      - name: 定位 Android platform（取 runner 上最高版本兜底）
        id: platform
        run: |
          PJAR="$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n1)"
          echo "android_jar=$PJAR" >> "$GITHUB_OUTPUT"
          echo "使用 bootclasspath: $PJAR"

      - name: javac 编译（Java 8 语法级，bootclasspath = android.jar）
        run: |
          mkdir -p dex/build/classes
          find dex/src -name '*.java' | sort > dex/build/sources.list
          javac -source 8 -target 8 \
            -bootclasspath "${{ steps.platform.outputs.android_jar }}" \
            -d dex/build/classes @dex/build/sources.list

      - name: d8 转 dex（min-api 30）+ 版本 hash 闭环
        run: |
          D8="$(ls -d "$ANDROID_HOME"/build-tools/*/d8 | sort -V | tail -n1)"
          echo "使用 d8: $D8"
          # d8 要求 --output 为已存在目录（或 zip/jar 文件名），必须先创建
          mkdir -p dex/build/out
          find dex/build/classes -name '*.class' | sort | xargs "$D8" \
            --min-api ${{ env.API_LEVEL }} \
            --output dex/build/out
          mv dex/build/out/classes.dex dex/build/probe.dex
          echo "${GITHUB_SHA::7}" > dex/build/probe.dex.hash

      - name: 编译 bridge.dex（L2b canonical NativeBridge，独立产物）
        run: |
          # bridge.dex 只含 NativeBridge（probe.dex 中的副本为父委托遮蔽的死代码，
          # 见 dex/src/.../hook/NativeBridge.java 类加载纪律注释）
          mkdir -p dex/build/bridge-classes dex/build/bridge-out
          javac -source 8 -target 8 \
            -bootclasspath "${{ steps.platform.outputs.android_jar }}" \
            -d dex/build/bridge-classes dex/src/ren/sunset/sundown/hook/NativeBridge.java
          D8="$(ls -d "$ANDROID_HOME"/build-tools/*/d8 | sort -V | tail -n1)"
          find dex/build/bridge-classes -name '*.class' | sort | xargs "$D8" \
            --min-api ${{ env.API_LEVEL }} --output dex/build/bridge-out
          mv dex/build/bridge-out/classes.dex dex/build/bridge.dex

      - name: 校验产物
        run: |
          ls -lh dex/build/probe.dex dex/build/bridge.dex
          cat dex/build/probe.dex.hash

      - name: 上传探针 dex 与版本 hash
        uses: actions/upload-artifact@v7
        with:
          name: probe-dex
          path: |
            dex/build/probe.dex
            dex/build/probe.dex.hash
            dex/build/bridge.dex
          retention-days: 30

  build-bridge:
    name: 编译 libsundownhook.so（L2b LSPlant bridge）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 拉取依赖 AAR（pinned 版本 + sha256 校验，可复现）
        run: |
          mkdir -p deps
          curl -fsSL -o deps/lsplant.aar \
            https://repo1.maven.org/maven2/org/lsposed/lsplant/lsplant/6.4/lsplant-6.4.aar
          echo "9f40ff7d7b9ef6575aecc057c4de0796e5c6253ad24c2a91896c11435b404709  deps/lsplant.aar" \
            | sha256sum -c -
          curl -fsSL -o deps/dobby.aar \
            https://repo1.maven.org/maven2/io/github/vvb2060/ndk/dobby/1.2/dobby-1.2.aar
          echo "251f48ae21686d7f69276c50644ca345f450e45110057437f7d76bb14cddf3a1  deps/dobby.aar" \
            | sha256sum -c -
          cd deps
          unzip -o -q lsplant.aar -d lsplant
          unzip -o -q dobby.aar -d dobby
          ls -lh lsplant/prefab/modules/lsplant/libs/android.arm64-v8a/ \
                 dobby/prefab/modules/dobby/libs/android.arm64-v8a/

      - name: 构建 libsundownhook.so（runner 自带 NDK + CMake + Ninja）
        working-directory: bridge
        run: |
          HASH="${GITHUB_SHA::7}"
          echo "BRIDGE_BUILD_HASH=$HASH"
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLSPLANT_PREFAB="$GITHUB_WORKSPACE/deps/lsplant/prefab/modules/lsplant" \
            -DDOBBY_PREFAB="$GITHUB_WORKSPACE/deps/dobby/prefab/modules/dobby" \
            -DBRIDGE_BUILD_HASH="$HASH"
          cmake --build build
          echo "$HASH" > build/hook.hash
          # LGPL-3.0：liblsplant.so 原样随模块分发（动态链接、不修改）
          cp "$GITHUB_WORKSPACE/deps/lsplant/prefab/modules/lsplant/libs/android.arm64-v8a/liblsplant.so" \
             build/liblsplant.so

      - name: 校验产物
        run: |
          file bridge/build/libsundownhook.so bridge/build/liblsplant.so
          ls -lh bridge/build/libsundownhook.so bridge/build/liblsplant.so
          cat bridge/build/hook.hash

      - name: 上传 bridge 产物与 hash
        uses: actions/upload-artifact@v7
        with:
          name: sundownhook-arm64-v8a
          path: |
            bridge/build/libsundownhook.so
            bridge/build/liblsplant.so
            bridge/build/hook.hash
          retention-days: 30

  package-module:
    name: 打包 KSU 模块 zip
    needs: [build-daemon, build-probe, build-dex, build-bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 下载 daemon 二进制并注入模块
        uses: actions/download-artifact@v8
        with:
          name: sundownd-aarch64
          path: module/system/bin/
      # 注意：此时 module/system/bin/sundownd 的文本占位文件被真实二进制覆盖
      # （仅 CI 工作区，不提交；占位文件仍在 git 中保证脚本兼容）

      - name: 下载探针桩并注入模块（zygisk 约定路径 + 期望 hash）
        uses: actions/download-artifact@v8
        with:
          name: libsunprobe-arm64-v8a
          path: probe/build/

      - name: 布置 zygisk 资产
        run: |
          mkdir -p module/zygisk
          cp probe/build/libsunprobe.so module/zygisk/arm64-v8a.so
          cp probe/build/probe.hash module/zygisk/probe.hash
          ls -lh module/zygisk/

      - name: 下载探针 dex 并注入模块（L2）
        uses: actions/download-artifact@v8
        with:
          name: probe-dex
          path: dex/build/

      - name: 布置 dex 资产（root 字节源 + 期望版本 + magic-mount 冷启动兜底）
        run: |
          # 1) root 侧字节源：post-fs-data.sh 同步到 /data/adb/sundown/probe/，
          #    daemon 经 abstract socket 下发字节（uid 1000 不直接读 /data/adb——DAC 铁律）
          mkdir -p module/probe
          cp dex/build/probe.dex module/probe/probe.dex
          cp dex/build/probe.dex.hash module/probe/probe.dex.hash
          # 2) magic-mount 兜底：uid 1000 可读、SELinux 无争议；dex 层冷启动/断线自愈用
          mkdir -p module/system/etc/sundown
          cp dex/build/probe.dex module/system/etc/sundown/probe.dex
          # 3) L2b canonical NativeBridge（bridge.dex）：probe.dex 各代的父链，
          #    native 唯一绑定点（类加载拓扑见 dex/src/.../hook/LsPlantBridge.java）
          cp dex/build/bridge.dex module/system/etc/sundown/bridge.dex
          chmod 0644 module/system/etc/sundown/probe.dex module/system/etc/sundown/bridge.dex
          ls -lh module/probe/ module/system/etc/sundown/

      - name: 下载 bridge 产物并注入模块（L2b native 伴生库）
        uses: actions/download-artifact@v8
        with:
          name: sundownhook-arm64-v8a
          path: bridge/build/

      - name: 布置 bridge 资产（magic-mount 原生库 + 期望 hash）
        run: |
          # system/lib64/：magic-mount → /system/lib64/，uid 1000 可读（dex 层 System.load）
          mkdir -p module/system/lib64
          cp bridge/build/libsundownhook.so module/system/lib64/libsundownhook.so
          cp bridge/build/liblsplant.so module/system/lib64/liblsplant.so
          chmod 0644 module/system/lib64/*.so
          # hook/hook.hash：daemon 期望 bridge build hash（四位一体闭环；hook/ 不入 /system）
          mkdir -p module/hook
          cp bridge/build/hook.hash module/hook/hook.hash
          ls -lh module/system/lib64/ module/hook/

      - name: 修正权限
        run: |
          chmod 755 module/system/bin/sundownd module/system/bin/sunctl
          chmod 755 module/post-fs-data.sh module/service.sh module/uninstall.sh module/customize.sh

      - name: 读取模块版本
        id: meta
        run: echo "version=$(grep '^version=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: 版本号一致性防呆校验（README「版本号策略」三处同步）
        run: |
          MP="$(grep '^version=' module/module.prop | cut -d= -f2 | sed 's/^v//')"
          PD="$(grep '^pub const VERSION_NAME' daemon/src/paths.rs | cut -d'"' -f2)"
          SC="$(grep '^VERSION=' module/system/bin/sunctl | cut -d'"' -f2)"
          echo "module.prop=$MP paths.rs=$PD sunctl=$SC"
          if [ "$MP" != "$PD" ] || [ "$MP" != "$SC" ]; then
            echo "::error::版本号三处不同步（module.prop / paths.rs / sunctl），见 README「版本号策略」"
            exit 1
          fi

      - name: 打包模块 zip
        run: |
          cd module
          zip -r9 "../sundown-${{ steps.meta.outputs.version }}.zip" . -x '.*'
          cd ..
          ls -lh sundown-*.zip

      # 模块 zip 不再上传 artifact：artifact 下载强制双层套娃（机制无法关闭），
      # 单层模块包统一走下方 Nightly 滚动 Release 渠道，避免误下载。

      - name: 移动 nightly tag 到本次构建 commit
        # action-gh-release 滚动更新只换 asset 不移 tag，需手动强制移动保持指向一致
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin "refs/tags/nightly"

      - name: 清理 Nightly 旧 assets（保证页面永远只有最新一个 zip）
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null | while read -r a; do
            case "$a" in
              sundown-*.zip) gh release delete-asset nightly "$a" -y ;;
            esac
          done

      - name: 滚动 Nightly Release（单层 zip 下载渠道）
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Sundown Nightly（CI 自动构建）
          body: |
            每次 push main 自动滚动更新，永远指向最新成功构建。
            **sundown-vX.Y.Z.zip 即单层 KSU 模块包**，管理器本地安装直接选它。
            （Actions Artifacts 渠道下载为双层套娃 zip；本渠道为单层，日常使用走这里。）
          prerelease: true
          overwrite_files: true
          files: sundown-*.zip

      - name: 发布到 GitHub Release（手动创建 Release 时触发）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: sundown-*.zip