# Sundown L3 冻结策略（conf/policy.toml）— inotify 热加载，修改保存即生效
# 失败安全铁律：语法错误 → 保留旧表 + 日志留痕；未知键/段 → 警告不致命
#
# ⚠️ 发布默认 enabled=false（观望模式）：冻结是强副作用操作，确认无异常后再开启。
# 实测教训（2026-08-02 首版）：grace=10s + 无豁免字段会误冻高频 app（含 AI 助手自身）→
# binder 阻塞 ANR/闪退；启用前请先完善白名单并观察 grace_pending 列表。
#
# ✅ 实测结论（2026-08-02 v0.4.9-l3，ColorOS 实机，白名单 11 包 + 3 per-app）：
#   strict+5s → focus→grace(5s)→freeze(grace_expired) 全链路通过
#   唤醒解冻 → 重新打开冻结 app 触发 unfreeze(foreground)，恢复前台
#   standard  → 跟随全局 grace 30s 到期冻结（mark.via 实测）
#   exempt    → 退后台不进 grace（grace_pending 无），永不冻结（termux 实测 35s+）
#   真实场景 → 抖音退后台 30s 自动冻结；用户点开自动唤醒解冻（wakeup_thaws+1）
#   无副作用 → 全程无 ANR/崩溃；微信/QQ 后台唤醒仅记录不冻结
#
# [general]   enabled 总开关 / grace_seconds 退后台宽限秒数 / cooldown_seconds 解冻后冷却秒数
#             wake_throttle_seconds 唤醒节流秒数（v0.4.42-l3，对齐 AStop Probe 60s 限流）：
#               后台唤醒（broadcast/service/pendingintent）触发解冻后，窗口内同包再次唤醒
#               不解冻（防 FCM/广播风暴反复解冻-再冻抖动）；0=关闭；用户交互（focus）不受限
# [freeze]    force 立即冻结包（不走 grace）
# [whitelist] packages 豁免包（退后台不冻结）/ keep_fg_service 前台服务豁免 / keep_media 媒体播放豁免
#             receiver_gate 广播门控白名单（v0.4.43-l3，对齐 AStop Receiver gate 裁剪版）：
#               非空时冻结 app 仅白名单广播 action 触发解冻（其余留痕 receiver_gated 不解冻）；
#               空 = 全部放行（默认零风险）；仅约束 broadcast 源（service/pendingintent 不受限）；
#               IMPORTANT 档 app 不受门控（保持"重要"语义）
#             keep_location 定位活动豁免（v0.4.20-l3：dex 侧 AppOps 判定 loc=1，定位使用中不冻）
#             keep_high_network 高网络负载豁免（v0.4.19-l3，daemon 侧流量采样判定）
#             keep_network 网络豁免（v0.4.23-l3，对齐 AStop force_network_exemption）：
#               有网络活动（任何流量增量 >0）即不冻结——比 keep_high_network 高阈值更宽松；
#               已冻结时检测到网络活动 → 自动唤醒解冻（对齐 AStop allow_network_wakeup）。
#               VPN/推送/下载/通话类网络敏感 app 推荐开启（缺省 true）。
#             push_policy 子进程策略 keep|kill（v0.4.19-l3：冻结时 :push 类子进程 保留/杀死）
# [apps."pkg"] per-app 策略（v0.4.8-l3 新增，参考 Cerberus 四策略分级）：
#   mode = "exempt"   豁免：退后台永不冻结（等价 whitelist，可携带独立豁免开关）
#   mode = "important" 重要（v0.4.41-l3，对齐 AStop IMPORTANT 档）：可冻结但更温和——
#                     grace = 全局 ×2（退后台不急着冻）+ 唤醒解冻强制开启（keep_wakeup 不可关），
#                     语义 = 微信/IM/网盘类"重要但不豁免"，墓碑而非杀
#   mode = "standard" 标准：按全局 grace_seconds（可被 grace_seconds 覆盖）
#   mode = "strict"   严格：失焦后短 grace 冻结（缺省 8s，可被 grace_seconds 覆盖）
#   grace_seconds = N    覆盖该包 grace（strict 缺省 8s；standard 缺省跟随全局）
#   keep_fg_service / keep_media = true|false  per-app 豁免开关（缺省跟随全局）
#   keep_location = true|false  per-app 定位活动豁免开关（v0.4.20-l3，缺省跟随全局）
#   keep_high_network = true|false  per-app 高网络豁免开关（v0.4.19-l3，缺省跟随全局）
#   keep_network = true|false  per-app 网络豁免开关（v0.4.23-l3：有网络活动即不冻结 +
#                              冻结中网络唤醒；缺省跟随全局 keep_network）
#   keep_wakeup = true|false  per-app 交互/FCM 唤醒解冻开关（v0.4.19-l3；false = 唤醒不解冻，
#                              防 FCM/唤醒风暴 app 反复解冻，缺省 true 保持既有行为）
#   push_mode = "keep"|"kill"  per-app 子进程策略（v0.4.19-l3，缺省跟随全局 push_policy）
#   unfreeze_window = "HH:MM-HH:MM"  per-app 定时解冻窗口（v0.4.19-l3：窗口内退后台不冻结；
#                              不支持跨零点，如 22:00-23:59；缺省无窗口）
# [defense]   防御 hook 组（v0.4.24-l3：L2 dex 侧 ANR 隐身/系统 freezer 防双冻结/Activity 保护
#              ——随 probe.dex 热更新生效，无需本段开关；本段仅解析兼容旧配置）
# [critical]  内置关键包清单（v0.4.24-l3：launcher/systemUI/电话/设置/输入法/VPN 授权/
#             权限控制器等编译期内置，任何配置/UI 均不可冻结——防呆，对齐 AStop
#             critical_apps.txt；清单不可增删，参见 daemon/src/policy.rs CRITICAL_PACKAGES）
# [vpn]       VPN 守护进程保护（v0.4.22-l3）：
#   keep_vpn = true|false  true = 自动探测的 tun 隧道持有者永不冻结（缺省 true）
#             ——VPN app 被冻结 = 隧道断开 = 全网 app 断网（实机反馈），
#             其主进程非 :push 类，选择性冻结/软豁免都保不住，必须硬豁免。
#   packages = [ ... ]     手动兜底列表：自动探测失效（非标准 tun fd 实现）时
#             直接把 VPN app 包名列在这里，命中即受保护（优先级最高）。
# [discard]   超时丢弃（v0.4.52-l3，行为概念《墓碑行为对齐之超时丢弃》——直击
#             "冻结 ≠ 释放内存"痛点：cgroup freezer 只暂停调度，RSS 仍占内存；
#             墓碑该做的是"冻住 → 过期 → 丢弃 → 释放内存"）：
#   frozen_timeout_seconds = N   冻结超时丢弃秒数（缺省 1800 = 30min；0 = 关闭）：
#             冻结时长超该值且期间无任何唤醒命中 → 升级为丢弃（SIGKILL 整 uid）。
#             语义：30 分钟没被唤醒的冻结 app ≈ 用户不需要 → 丢弃释放内存；
#             "期间零活跃"口径：被唤醒节流/广播门控拦截的唤醒**不算活跃**
#             （防 FCM 风暴把超时无限续期）；任何实际解冻会重置超时。
#   mem_watermark_mb = N     内存水位丢弃阈值 MB（缺省 512；0 = 关闭）：
#             /proc/meminfo MemAvailable 低于该值 → 按 LRU（最旧优先）+ RSS 占用
#             排序，丢弃冻结集直到水位恢复（超时未到但内存告急 → 提前丢弃）。
#   boot_reclaim = true|false  开机缓存回收（缺省 true）：boot_completed 后延迟
#             boot_reclaim_delay_seconds 秒，扫描"上次会话 Sundown 冻结集 +
#             当前冻结集"中 oom_score_adj ≥ 缓存档（900）的包 → 丢弃——
#             "开机时的高缓存"由 Sundown 主动回收，不再等系统慢慢杀。
#   boot_reclaim_delay_seconds = N  开机回收延迟秒数（缺省 120，等系统恢复期结束）
#   ⚠️ 安全护栏（三机制共同）：只作用于 Sundown 自己的冻结集/候选池；白名单 /
#      per-app exempt / IMPORTANT / critical 内置 / 动态系统组件 / VPN 硬豁免 /
#      前台 app 一律不参与（daemon 侧 discard_ineligible 判定面保证）；
#      丢弃前 cgroup.procs 归属核验防 pid 复用误杀；丢弃 = 最终动作不可撤销
#      （用户切回时走冷启动）；事件留痕 discard pkg=... reason=... + JSONL 审计 +
#      status discard_ops / discarded_packages / discard_reasons 观测。
#      发布默认全部开启，但受 [general] enabled 总开关约束——观望模式零动作。

[general]
enabled = false
grace_seconds = 30
cooldown_seconds = 60
wake_throttle_seconds = 60

[discard]
frozen_timeout_seconds = 1800
mem_watermark_mb = 512
boot_reclaim = true
boot_reclaim_delay_seconds = 120

[freeze]
force = []

[vpn]
keep_vpn = true
packages = []

[whitelist]
packages = [
    "com.android.systemui",
    "com.android.settings",
    "com.android.phone",
    "com.android.launcher3",
    "com.android.launcher",
    "com.oplus.launcher",
    "com.coloros.launcher",
    "com.google.android.gms",
    "com.google.android.gsf",
    "com.ai.assistance.operit",
    "com.resukisu.resukisu",
]
keep_fg_service = true
keep_media = true
keep_location = true
keep_high_network = true
keep_network = true
push_policy = "keep"

# ---- per-app 策略示例（默认全部注释：不配置 = 跟随全局 standard 规则）----
# 通讯类高频 app：strict + 保留媒体豁免（语音通话/视频播放中不冻），grace 15s 兼顾消息场景
# [apps."com.tencent.mm"]
# mode = "strict"
# grace_seconds = 15
# keep_media = true
#
# 同上（QQ 与微信同策略）
# [apps."com.tencent.mobileqq"]
# mode = "strict"
# grace_seconds = 15
# keep_media = true
#
# 短视频：standard 跟随全局（刷完退后台 30s 后冻，省电；播放中媒体豁免不冻）
# [apps."com.ss.android.ugc.aweme"]
# mode = "standard"
#
# 开发者工具：完全豁免（后台常驻任务，如编译/同步/终端）
# [apps."com.termux"]
# mode = "exempt"
#
# 游戏类：strict + 关闭媒体豁免（挂机场景也要冻，省电优先）
# [apps."com.tencent.tmgp.sgame"]
# mode = "strict"
# grace_seconds = 5
# keep_media = false

[defense]
anr_protect = false
cached_app_optimizer = false

